<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Phishing Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Smart Phishing Detector</h1>

        <form method="POST">
            <input type="text" name="message" placeholder="Enter your message..." value="{{ message }}">
            <button type="submit">Check</button>
        </form>

        {% if result %}
        <div class="result {% if 'Phishing' in result %}phishing{% else %}safe{% endif %}">
            {{ result }}

            <div class="confidence">
                <div class="confidence-inner" style="width: {{ confidence }}%;"></div>
            </div>
        </div>

        <div class="explanation">
            <strong>Reason:</strong> {{ explanation }}
        </div>

        <div class="explanation">
            <strong>Action:</strong> {{ recommendation }}
        </div>

        <form method="POST" action="/action">
            <input type="hidden" name="message" value="{{ message }}">
            <input type="hidden" name="result" value="{{ result }}">
            <input type="hidden" name="explanation" value="{{ explanation }}">
            <input type="hidden" name="confidence" value="{{ confidence }}">

            <button type="submit" name="action" value="approve">✅ Approve</button>
            <button type="submit" name="action" value="reject">❌ Reject</button>
        </form>
        {% endif %}

        <div class="footer">💖 AI-powered detection</div>
    </div>
</body>
</html>
