<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cyber Human Shield</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🛡️ AI Cyber Human Shield</h1>
        <p class="subtitle">AI Augmented Cyber Defense, but Human Controlled</p>
        
        <form id="analysis-form">
            <textarea id="message-input" placeholder="Paste email, SMS, or social media post here..." rows="4"></textarea>
            <button type="submit">🔍 Analyze Threat</button>
        </form>

        <div id="result-section" style="display:none;">
            <div class="card result-card">
                <h3>📊 AI Analysis Result</h3>
                <p><strong>Threat Type:</strong> <span id="res-threat"></span></p>
                <p><strong>Risk Score:</strong> <span id="res-risk"></span>/100</p>
                <p><strong>Confidence:</strong> <span id="res-confidence"></span>%</p>
                <p><strong>Explanation (XAI):</strong> <span id="res-explanation"></span></p>
                <p><strong>AI Recommendation:</strong> <span id="res-recommendation"></span></p>
            </div>

            <div class="human-controls">
                <p>⚠️ AI proposes. <strong>You decide.</strong></p>
                <input type="text" id="operator-name" placeholder="Operator Name">
                <button class="btn-approve" onclick="submitAction('approve')">✅ Approve</button>
                <button class="btn-reject" onclick="submitAction('reject')">❌ Reject</button>
            </div>
            <p id="final-message" class="status-msg"></p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
