version: '3.8'

services:
  cyber-shield:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-cyber-human-shield
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:////app/data/cyber_shield.db
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
    driver: local